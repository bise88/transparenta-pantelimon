<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprindem Lumina - Comparator Transparenta</title>
  <meta name="description" content="Compara transparenta administratiei publice: Pantelimon vs Oradea.">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --albastru: #00427A; --albastru-deschis: #0070C0; --galben: #F5A623;
      --verde: #28A745; --rosu: #DC3545; --gri-deschis: #F4F7FA;
      --gri-mediu: #DEE2E6; --text: #1A1A2E; --text-secundar: #6C757D;
      --radius: 12px; --umbra: 0 2px 12px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--gri-deschis); color: var(--text); min-height: 100vh; }
    header { background: linear-gradient(135deg, var(--albastru) 0%, #001f3f 100%); color: #fff; padding: 2rem 1.5rem 1.5rem; text-align: center; }
    .header-icon { font-size: 2.5rem; display: block; margin-bottom: 0.4rem; }
    header h1 { font-size: 1.7rem; font-weight: 700; }
    header h1 span { color: var(--galben); }
    header p.tagline { margin-top: 0.4rem; font-size: 0.95rem; opacity: 0.85; }
    .data-badge { display: inline-block; margin-top: 0.8rem; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 0.3rem 0.9rem; font-size: 0.78rem; color: rgba(255,255,255,0.8); }
    .nav-bar { background: #fff; border-bottom: 1px solid var(--gri-mediu); padding: 0.6rem 1.5rem; font-size: 0.85rem; }
    .nav-bar a { color: var(--albastru-deschis); text-decoration: none; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .hero-scor { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }
    .card-scor { background: #fff; border-radius: var(--radius); box-shadow: var(--umbra); padding: 1.5rem; text-align: center; border-top: 4px solid var(--albastru-deschis); }
    .card-scor.referinta { border-top-color: var(--verde); }
    .card-scor .localitate-tip { font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secundar); margin-bottom: 0.3rem; }
    .localitate-tip.tip-referinta { color: var(--verde); }
    .card-scor h2 { font-size: 1.3rem; color: var(--albastru); margin-bottom: 0.2rem; }
    .card-scor .judet { font-size: 0.8rem; color: var(--text-secundar); margin-bottom: 1rem; }
    .scor-mare { font-size: 3.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.3rem; }
    .scor-mare.bun { color: var(--verde); } .scor-mare.mediu { color: var(--galben); } .scor-mare.slab { color: var(--rosu); }
    .scor-label { font-size: 0.78rem; color: var(--text-secundar); margin-bottom: 0.8rem; }
    .barra-scor { height: 8px; background: var(--gri-mediu); border-radius: 4px; overflow: hidden; }
    .barra-scor-fill { height: 100%; border-radius: 4px; }
    .barra-scor-fill.bun { background: var(--verde); } .barra-scor-fill.mediu { background: var(--galben); } .barra-scor-fill.slab { background: var(--rosu); }
    .vs-badge { background: var(--albastru); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; margin: 0 auto; }
    .sectiune { background: #fff; border-radius: var(--radius); box-shadow: var(--umbra); margin-bottom: 1.5rem; overflow: hidden; }
    .sectiune-header { padding: 1rem 1.5rem; background: var(--gri-deschis); border-bottom: 1px solid var(--gri-mediu); font-weight: 600; font-size: 0.95rem; color: var(--albastru); display: flex; align-items: center; gap: 0.5rem; }
    .componente-grid { padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .componenta-row { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 0.5rem; align-items: center; }
    .componenta-scor { font-size: 1rem; font-weight: 700; text-align: center; }
    .componenta-scor.bun { color: var(--verde); } .componenta-scor.mediu { color: var(--galben); } .componenta-scor.slab { color: var(--rosu); }
    .componenta-centru { text-align: center; }
    .comp-label { font-size: 0.78rem; color: var(--text-secundar); margin-bottom: 0.35rem; line-height: 1.3; }
    .componenta-barra { position: relative; height: 10px; background: var(--gri-mediu); border-radius: 5px; overflow: visible; }
    .comp-fill-stanga { position: absolute; right: 50%; top: 0; height: 100%; border-radius: 5px 0 0 5px; }
    .comp-fill-dreapta { position: absolute; left: 50%; top: 0; height: 100%; border-radius: 0 5px 5px 0; }
    .divider-centru { position: absolute; left: 50%; transform: translateX(-50%); top: -3px; width: 2px; height: 16px; background: var(--text); z-index: 1; }
    .grafic-wrap { padding: 1.5rem; }
    .grafic-nota { font-size: 0.78rem; color: var(--text-secundar); margin-top: 0.8rem; text-align: center; }
    .concluzie-box { background: linear-gradient(135deg, #f0f8ff 0%, #e8f5e9 100%); border-radius: var(--radius); border: 1px solid var(--gri-mediu); padding: 1.3rem 1.5rem; margin-bottom: 1.5rem; }
    .concluzie-box h3 { color: var(--albastru); font-size: 0.95rem; margin-bottom: 0.6rem; }
    .concluzie-box p { font-size: 0.88rem; line-height: 1.6; }
    .sursa-date { font-size: 0.75rem; color: var(--text-secundar); text-align: center; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--gri-mediu); }
    .sursa-date a { color: var(--albastru-deschis); text-decoration: none; }
    .loading { text-align: center; padding: 3rem; color: var(--text-secundar); }
    .loading-spinner { width: 40px; height: 40px; border: 4px solid var(--gri-mediu); border-top-color: var(--albastru-deschis); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .eroare-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: var(--radius); padding: 1rem 1.5rem; margin-bottom: 1rem; font-size: 0.88rem; }
    .links-uat { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin: 1.2rem 0; }
    .links-uat a { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; background: var(--albastru); color: #fff; border-radius: 6px; font-size: 0.82rem; text-decoration: none; }
    .links-uat a.verde { background: var(--verde); }
    @media (max-width: 600px) { .hero-scor { grid-template-columns: 1fr; } .vs-badge { display: none; } }
  </style>
</head>
<body>
<header>
  <span class="header-icon">&#128294;</span>
  <h1><span>Aprindem</span> Lumina</h1>
  <p class="tagline">Transparenta aduce dreptate si eficienta!</p>
  <div class="data-badge" id="data-actualizare">Se incarca datele...</div>
</header>
<nav class="nav-bar">
  <a href="index.html">&larr; Acasa</a> &rsaquo; Comparator Transparenta
</nav>
<main>
  <div id="continut-principal">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Se incarca datele din SEAP...</p>
    </div>
  </div>
</main>
<script>
var UAT = [
  { id: 'pantelimon', nume: 'Pantelimon', judet: 'Ilfov', tip: 'monitorizat', raportUrl: 'raport.json', istoricUrl: 'istoric_scor.json', linkRaport: 'raport_transparenta.html' },
  { id: 'oradea', nume: 'Oradea', judet: 'Bihor', tip: 'referinta', raportUrl: 'oradea/raport.json', istoricUrl: 'oradea/istoric_scor.json', linkRaport: 'oradea/raport_transparenta.html' }
];
var META = {
  achizitii_directe: 'Achizitii directe',
  ofertant_unic: 'Ofertant unic',
  sedinte_extraordinare: 'Sedinte extraordinare',
  fragmentare: 'Fragmentare contracte',
  documente_publicate: 'Documente publicate',
  raspuns_544: 'Raspuns L.544/2001'
};
function cls(s) { return s === null ? 'mediu' : s >= 80 ? 'bun' : s >= 60 ? 'mediu' : 'slab'; }
function fj(url) { return fetch(url + '?t=' + Date.now()).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
function cardHtml(u, scor) {
  if (!u) return '<div class="card-scor"><p>Date indisponibile</p></div>';
  var c = cls(scor); var p = scor || 0;
  return '<div class="card-scor ' + (u.tip === 'referinta' ? 'referinta' : '') + '">' +
    '<div class="localitate-tip ' + (u.tip === 'referinta' ? 'tip-referinta' : '') + '">' + (u.tip === 'referinta' ? 'Primarie de referinta' : 'Primarie monitorizata') + '</div>' +
    '<h2>' + u.nume + '</h2><div class="judet">' + u.judet + '</div>' +
    '<div class="scor-mare ' + c + '">' + (scor !== null ? scor : '-') + '</div>' +
    '<div class="scor-label">Scor transparenta / 100</div>' +
    '<div class="barra-scor"><div class="barra-scor-fill ' + c + '" style="width:' + p + '%"></div></div></div>';
}
function concluzie(sP, sO) {
  if (sP === null || sO === null) return '';
  var d = sO - sP;
  var t = d <= 0 ? 'Pantelimon (' + sP + '/100) obtine un scor similar sau mai bun decat Oradea (' + sO + '/100).' :
    d <= 15 ? 'Diferenta de ' + d + ' puncte intre Pantelimon (' + sP + '/100) si Oradea (' + sO + '/100) este recuperabila.' :
    d <= 30 ? 'Oradea (' + sO + '/100) depaseste Pantelimon (' + sP + '/100) cu ' + d + ' puncte — practici sistematice de transparenta absente in Pantelimon.' :
    'Diferenta de ' + d + ' puncte intre Oradea (' + sO + '/100) si Pantelimon (' + sP + '/100) este semnificativa. Oradea demonstreaza ca o administratie mai buna este posibila.';
  return '<div class="concluzie-box"><h3>Ce spun datele?</h3><p>' + t + ' Toate datele provin din SEAP si din registrele publice ale primariilor.</p></div>';
}
async function init() {
  var box = document.getElementById('continut-principal');
  var res = await Promise.allSettled(UAT.map(function(u) { return fj(u.raportUrl).then(function(d) { return Object.assign({}, u, {data: d}); }); }));
  var ok = res.filter(function(r) { return r.status === 'fulfilled'; }).map(function(r) { return r.value; });
  var err = res.filter(function(r) { return r.status === 'rejected'; }).map(function(r, i) { return {uat: UAT[i], e: r.reason}; });
  if (!ok.length) { box.innerHTML = '<div class="eroare-box">Nu s-au putut incarca datele.</div>'; return; }
  var ds = ok[0] && ok[0].data && (ok[0].data.generated_at || ok[0].data.data_procesare);
  if (ds) document.getElementById('data-actualizare').textContent = 'Date: ' + ds.slice(0,10).split('-').reverse().join('.');
  var ist = {};
  await Promise.allSettled(ok.map(function(u) { return fj(u.istoricUrl).then(function(d) { ist[u.id] = Array.isArray(d) ? d : (d.puncte || []); }).catch(function() { ist[u.id] = []; }); }));
  var dP = ok.find(function(u) { return u.id === 'pantelimon'; });
  var dO = ok.find(function(u) { return u.id === 'oradea'; });
  var sP = dP && dP.data && dP.data.scor_transparenta ? (dP.data.scor_transparenta.scor !== undefined ? dP.data.scor_transparenta.scor : dP.data.scor_transparenta) : null;
  var sO = dO && dO.data && dO.data.scor_transparenta ? (dO.data.scor_transparenta.scor !== undefined ? dO.data.scor_transparenta.scor : dO.data.scor_transparenta) : null;
  var cP = dP && dP.data && dP.data.scor_transparenta && dP.data.scor_transparenta.componente || {};
  var cO = dO && dO.data && dO.data.scor_transparenta && dO.data.scor_transparenta.componente || {};
  var eHtml = err.map(function(e) { return '<div class="eroare-box">Date indisponibile pentru ' + e.uat.nume + ': ' + e.e.message + '</div>'; }).join('');
  var keys = Object.keys(Object.assign({}, cP, cO, META));
  var compHtml = keys.map(function(k) {
    var vP = cP[k] !== undefined ? cP[k] : null;
    var vO = cO[k] !== undefined ? cO[k] : null;
    var cPc = cls(vP); var cOc = cls(vO);
    var pP = vP !== null ? Math.min(vP/2,50) : 0;
    var pO = vO !== null ? Math.min(vO/2,50) : 0;
    var colP = cPc==='bun'?'var(--verde)':cPc==='mediu'?'var(--galben)':'var(--rosu)';
    var colO = cOc==='bun'?'var(--verde)':cOc==='mediu'?'var(--galben)':'var(--rosu)';
    return '<div class="componenta-row">' +
      '<div class="componenta-scor ' + cPc + '">' + (vP!==null?vP:'-') + '</div>' +
      '<div class="componenta-centru"><div class="comp-label">' + (META[k]||k) + '</div>' +
      '<div class="componenta-barra"><div class="divider-centru"></div>' +
      '<div class="comp-fill-stanga" style="width:' + pP + '%;background:' + colP + '"></div>' +
      '<div class="comp-fill-dreapta" style="width:' + pO + '%;background:' + colO + '"></div></div></div>' +
      '<div class="componenta-scor ' + cOc + '">' + (vO!==null?vO:'-') + '</div></div>';
  }).join('');
  var iP = ist['pantelimon'] || []; var iO = ist['oradea'] || [];
  var graficHtml = (iP.length > 1 || iO.length > 1) ? '<canvas id="chart-e" height="80"></canvas>' : '<p style="text-align:center;color:var(--text-secundar);padding:1rem;font-size:0.85rem">Istoricul va fi disponibil dupa mai multe rulari.</p>';
  box.innerHTML = eHtml +
    '<div class="hero-scor">' + cardHtml(dP, sP) + '<div class="vs-badge">VS</div>' + cardHtml(dO, sO) + '</div>' +
    '<div class="links-uat">' + (dP ? '<a href="' + dP.linkRaport + '">Raport Pantelimon</a>' : '') + (dO ? '<a href="' + dO.linkRaport + '" class="verde">Raport Oradea</a>' : '') + '</div>' +
    concluzie(sP, sO) +
    '<div class="sectiune"><div class="sectiune-header">Comparatie pe componente<span style="font-weight:400;color:var(--text-secundar);font-size:0.8rem;margin-left:auto"><span style="color:var(--albastru-deschis)">&#9632;</span> Pantelimon &nbsp;<span style="color:var(--verde)">&#9632;</span> Oradea</span></div>' +
    '<div class="componente-grid"><div class="componenta-row" style="font-size:0.72rem;color:var(--text-secundar);padding-bottom:0.3rem;border-bottom:1px solid var(--gri-mediu)"><div style="text-align:center">Pantelimon</div><div style="text-align:center">Indicator</div><div style="text-align:center">Oradea</div></div>' +
    compHtml + '</div></div>' +
    '<div class="sectiune"><div class="sectiune-header">Evolutie scor in timp</div><div class="grafic-wrap">' + graficHtml + '<p class="grafic-nota">Sursa: SEAP. Actualizat lunar.</p></div></div>' +
    '<div class="sursa-date">Date extrase din <a href="https://e-licitatie.ro" target="_blank" rel="noopener">SEAP</a> (<a href="https://github.com/bise88/transparenta-pantelimon" target="_blank" rel="noopener">cod sursa public</a>).<br><a href="index.html">&larr; Inapoi</a></div>';
  if (iP.length > 1 || iO.length > 1) {
    var all = Array.from(new Set(iP.map(function(p){return p.data;}).concat(iO.map(function(p){return p.data;})))).sort();
    var mP = {}; var mO = {};
    iP.forEach(function(p){mP[p.data]=p.scor;}); iO.forEach(function(p){mO[p.data]=p.scor;});
    var cv = document.getElementById('chart-e');
    if (cv && typeof Chart !== 'undefined') {
      new Chart(cv, { type: 'line', data: { labels: all.map(function(d){return d.slice(0,7);}), datasets: [
        { label: 'Pantelimon', data: all.map(function(d){return mP[d]||null;}), borderColor: '#0070C0', backgroundColor: 'rgba(0,112,192,0.1)', tension: 0.3, pointRadius: 4, spanGaps: true },
        { label: 'Oradea', data: all.map(function(d){return mO[d]||null;}), borderColor: '#28A745', backgroundColor: 'rgba(40,167,69,0.1)', tension: 0.3, pointRadius: 4, spanGaps: true }
      ]}, options: { responsive: true, plugins: { legend: { position: 'top' } }, scales: { y: { min: 0, max: 100, ticks: { callback: function(v){return v+'/100';} } } } } });
    }
  }
}
init().catch(function(e) { document.getElementById('continut-principal').innerHTML = '<div class="eroare-box">Eroare: ' + e.message + '</div>'; });
</script>
</body>
</html>
