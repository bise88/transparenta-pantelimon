# Rulare unica: muta linkurile spre codul sursa de pe organizatia veche (marcata de GitHub)
# pe bise88/transparenta-pantelimon si invalideaza cache-ul service worker-ului.
# Dupa rulare, fisierul acesta se poate sterge.
name: "🔧 Linkuri cod sursa (o singura data)"
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inlocuieste linkurile si creste versiunea cache-ului
        run: |
          git grep -lI 'transparenta-locala/transparenta-pantelimon' -- ':!.github' ':!AUDIT*.md' ':!CLAUDE.md' \
            | xargs -r sed -i 's#transparenta-locala/transparenta-pantelimon#bise88/transparenta-pantelimon#g'
          python3 - <<'PY'
          import re
          s = open('sw.js', encoding='utf-8').read()
          s = re.sub(r"'tp-v(\d+)'", lambda m: f"'tp-v{int(m.group(1)) + 1}'", s)
          s = re.sub(r"'tp-static-v(\d+)'", lambda m: f"'tp-static-v{int(m.group(1)) + 1}'", s)
          open('sw.js', 'w', encoding='utf-8').write(s)
          PY
          grep -nE "CACHE_(VERSION|STATIC) =" sw.js
          echo "Ramase (in afara de documentatie):"; git grep -c 'github.com/transparenta-locala' -- ':!.github' ':!AUDIT*.md' ':!CLAUDE.md' || echo "niciuna"
          git config user.name "Monitor Transparență Cetățenesc Pantelimon"
          git config user.email "transparenta-bot@cetatenipantelimon.ro"
          git add -A
          git diff --staged --stat | tail -3
          git commit -m "fix: linkurile spre codul sursă duc la bise88/transparenta-pantelimon; cache SW +1"
          git pull --rebase origin main
          git push origin HEAD:main
